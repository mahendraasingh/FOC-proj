<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Pulsing Biohazard Crimson Aura -->
  <circle cx="100" cy="100" r="92" fill="#EF4444" fill-opacity="0.25" filter="blur(10px)"/>

  <!-- Outer Tactile Outline -->
  <g filter="drop-shadow(3px 4px 0px #111111)">
    <!-- Main Brain Shape (Melted, sagging and dripping slime) -->
    <path d="M60 152 
             C45 152 35 158 35 172 C35 176 39 178 42 174 C45 170 48 152 54 152 
             C56 152 58 165 62 178 C64 182 68 181 69 175 C72 165 74 153 78 153
             C82 153 85 168 88 184 C90 188 95 187 96 180 C98 166 102 154 106 154
             C112 154 116 172 120 186 C122 190 126 188 127 181 C130 168 134 154 140 154
             C155 154 165 168 168 180 C170 184 174 182 174 176 C174 160 162 148 144 148
             C176 140 178 114 174 110 C176 96 170 82 158 72 C160 52 142 36 122 40 C110 30 90 30 78 40 C58 36 40 52 42 72 C30 82 24 96 26 110 C22 126 34 144 60 152 Z" 
          fill="#DC2626" stroke="#111111" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Deep Fractured Fissures and Skull Crack Lines -->
    <path d="M96 38 L92 56 L104 74 L98 94 L106 118 L100 148" stroke="#450A0A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 38 L92 56 L104 74 L98 94 L106 118 L100 148" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slime highlights / rot spots -->
    <circle cx="56" cy="68" r="9" fill="#991B1B" stroke="#111111" stroke-width="2"/>
    <circle cx="53" cy="65" r="3" fill="#F87171"/>
    <circle cx="144" cy="66" r="11" fill="#991B1B" stroke="#111111" stroke-width="2"/>
    <circle cx="140" cy="62" r="4" fill="#F87171"/>
    <circle cx="152" cy="115" r="7" fill="#7F1D1D" stroke="#111111" stroke-width="2"/>

    <!-- X_X Knocked Out Dead / Rotting Eyes -->
    <g class="eyes">
      <!-- Left Eye: Crossed Out X -->
      <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
        <line x1="68" y1="96" x2="88" y2="116"/>
        <line x1="88" y1="96" x2="68" y2="116"/>
      </g>
      <g stroke="#111111" stroke-width="2.5" stroke-linecap="round">
        <line x1="68" y1="96" x2="88" y2="116"/>
        <line x1="88" y1="96" x2="68" y2="116"/>
      </g>

      <!-- Right Eye: Crossed Out X -->
      <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
        <line x1="112" y1="96" x2="132" y2="116"/>
        <line x1="132" y1="96" x2="112" y2="116"/>
      </g>
      <g stroke="#111111" stroke-width="2.5" stroke-linecap="round">
        <line x1="112" y1="96" x2="132" y2="116"/>
        <line x1="132" y1="96" x2="112" y2="116"/>
      </g>
    </g>

    <!-- Skull Grimace Teeth / Exhausted Melted Mouth -->
    <rect x="80" y="128" width="40" height="15" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    <line x1="88" y1="128" x2="88" y2="143" stroke="#111111" stroke-width="2.5"/>
    <line x1="96" y1="128" x2="96" y2="143" stroke="#111111" stroke-width="2.5"/>
    <line x1="104" y1="128" x2="104" y2="143" stroke="#111111" stroke-width="2.5"/>
    <line x1="112" y1="128" x2="112" y2="143" stroke="#111111" stroke-width="2.5"/>

    <!-- Slime Drips falling off -->
    <circle cx="89" cy="194" r="3" fill="#DC2626" stroke="#111111" stroke-width="1.5"/>
    <circle cx="121" cy="196" r="2.5" fill="#DC2626" stroke="#111111" stroke-width="1.5"/>

    <!-- Danger Sirens / Flashes -->
    <polygon points="100,12 108,26 122,18 116,32 130,34 118,44 126,56 112,50 106,64 100,52 94,64 88,50 74,56 82,44 70,34 84,32 78,18 92,26" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Status pill -->
  <rect x="42" y="174" width="116" height="20" rx="10" fill="#111111" stroke="#EF4444" stroke-width="1.8"/>
  <text x="100" y="188" text-anchor="middle" fill="#EF4444" font-family="monospace" font-size="9.5" font-weight="900" letter-spacing="1">CRITICAL // 120+ ROTTING</text>
</svg>

